# 開発環境: `docker compose up` 一発で Rails（SQLite 内蔵）が起動します。DB コンテナは不要です。
# アクセス: http://localhost:3001   管理画面: http://localhost:3001/admin
# （3000番は他の課題と重ならないよう 3001 を使用。変更するには .env に WEB_PORT=好きな番号）
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      RAILS_ENV: development
      # 以下の値は .env ファイル（.env.example を参照）で変更できます。
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_APP_NAME: ${NAVER_APP_NAME:-kr.eunpa.salon}
      APP_BASE_URL: ${APP_BASE_URL:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-5}
    volumes:
      - .:/rails
