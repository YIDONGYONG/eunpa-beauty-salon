name: Build & Deploy

# main へ push → テスト → イメージ作成 → GHCR へ push → （有効化した場合のみ）VM で pull して再起動。
# 1GB の VM でビルドしないため、ビルドはすべて GitHub Actions で行います（ADR 0004）。
# 配備先が決まるまでは deploy ジョブは動きません（リポジトリ変数 DEPLOY_ENABLED=true で有効化）。
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:test:prepare test
        env:
          RAILS_ENV: test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: VM で pull して再起動
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$VM_SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$VM_USER@$VM_HOST" \
            "cd /opt/eunpa && docker compose pull && docker compose up -d && docker image prune -f"
