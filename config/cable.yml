# async アダプターは同じプロセスの中でしか動かないため、コンソールから手動で更新を送るには、
# ブラウザで結果を見るには、開発用プロセスの中で動く web console を使う必要があります。
# bin/rails console で起動したターミナルでは動きません。web console を表示するには、アクションまたは ERB ビューに
# "console" を追加します。
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
